<!DOCTYPE html>
<html lang="gu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>મહેસુલી કર્મચારી મંડળ ચૂંટણી</title>
    <style>
        body { font-family: sans-serif; background-color: #f1f5f9; color: #334155; text-align: center; padding: 20px; }
        .container { max-width: 500px; width: 100%; background: #fff; padding: 25px; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.05); display: inline-block; }
        h1 { color: #1e3a8a; font-size: 1.5rem; }
        .card { border: 1px solid #e2e8f0; border-radius: 12px; padding: 15px; margin: 12px 0; display: flex; justify-content: space-between; align-items: center; }
        .name { font-size: 1.1rem; font-weight: bold; }
        .vote-btn { background: #1e3a8a; color: #fff; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-weight: bold; }
        .success-box { display: none; color: #10b981; font-size: 1.3rem; font-weight: bold; margin-top: 15px; }
        .result-box { background: #f0fdf4; border: 2px solid #bbf7d0; padding: 15px; border-radius: 12px; margin-top: 15px; text-align: left; display: none; }
        .admin-section { margin-top: 30px; border-top: 1px dashed #cbd5e1; padding-top: 15px; }
        .admin-panel { background: #0f172a; color: #fff; padding: 20px; border-radius: 12px; margin-top: 15px; text-align: left; display: none; }
        .log-table { width: 100%; border-collapse: collapse; margin-top: 15px; color: #fff; }
        .log-table th, .log-table td { border: 1px solid #334155; padding: 8px; font-size: 0.9rem; }
        .change-btn { background: #ea580c; color: #fff; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer; }
        .ctrl-btn { border: none; padding: 8px 12px; border-radius: 6px; cursor: pointer; font-weight: bold; color: #fff; }
    </style>
</head>
<body>

    <div class="container">
        <h1>મહેસુલી કર્મચારી મંડળ ચૂંટણી</h1>
        <div style="background:#fef2f2; color:#991b1b; padding:6px; border-radius:20px; font-weight:bold; margin-bottom:15px; display:inline-block;" id="countdown">૧૫ દિવસ બાકી</div>

        <!-- મતદાન ફોર્મ -->
        <div id="votingForm">
            <div class="card"><span class="name">૧. વિષ્ણૂ ભાઇ દેસાઇ</span><button class="vote-btn" onclick="castVote(1)">Vote Now</button></div>
            <div class="card"><span class="name">૨. હિતેશભાઇ રાઠવા</span><button class="vote-btn" onclick="castVote(2)">Vote Now</button></div>
        </div>

        <div id="successMessage" class="success-box"><div>✓</div>તમારો મત સફળતાપૂર્વક પેટીમાં નોંધાઈ ગયો છે!</div>

        <!-- પરિણામ જાહેર બોક્સ -->
        <div id="homeResultBox" class="result-box">
            <h3 style="color:#166534; text-align:center; margin-top:0;">📢 ચૂંટણીનું અંતિમ પરિણામ</h3>
            <p>૧. વિષ્ણૂ ભાઇ દેસાઇ: <span id="homeCount1">0</span> મત</p>
            <p>૨. હિતેશભાઇ રાઠવા: <span id="homeCount2">0</span> મત</p>
        </div>
    </div>

    <!-- એડમીન વિભાગ -->
    <div class="admin-section">
        <button style="background:none; border:none; color:#64748b; cursor:pointer; text-decoration:underline;" onclick="document.getElementById('adminLoginForm').style.display='block'">🔐 ગુપ્ત એડમીન વિભાગ</button>
        <div id="adminLoginForm" style="display:none; margin-top:10px;">
            <input type="password" id="adminPassword" placeholder="ગુપ્ત પાસવર્ડ" style="padding:8px; border-radius:6px; border:1px solid #cbd5e1;">
            <button class="vote-btn" style="padding:8px 15px;" onclick="verifyAdmin()">પ્રવેશ કરો</button>
        </div>

        <div id="hiddenAdminPanel" class="admin-panel">
            <div style="display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid #334155; padding-bottom:10px;">
                <h3 style="margin:0; color:#f59e0b;">📊 લાઇવ ડેશબોર્ડ</h3>
                <div>
                    <button id="publishBtnState" class="ctrl-btn" style="background:#2563eb; margin-right:5px;" onclick="togglePublishResult()">📢 પરિણામ જાહેર કરો</button>
                    <button class="ctrl-btn" style="background:#dc2626;" onclick="resetElectionData()">🔄 રીસેટ ઓપ્શન</button>
                </div>
            </div>
            <p style="margin-top:15px;"><strong>વિષ્ણૂ ભાઇ દેસાઇ:</strong> <span id="count1" style="color:#10b981;">0</span> મત</p>
            <p><strong>હિતેશભાઇ રાઠવા:</strong> <span id="count2" style="color:#10b981;">0</span> મત</p>
            <table class="log-table">
                <thead><tr><th>વોટર ID</th><th>મત</th><th>એક્શન</th></tr></thead>
                <tbody id="voterLogTable"></tbody>
            </table>
        </div>
    </div>

    <script>
        let votes = JSON.parse(localStorage.getItem('v_f')) || { 1: 0, 2: 0 };
        let voterLog = JSON.parse(localStorage.getItem('l_f')) || [];
        let isPublished = JSON.parse(localStorage.getItem('p_f')) || false;
        let electionEndDate = localStorage.getItem('t_f') || new Date().getTime() + (15 * 24 * 60 * 60 * 1000);
        localStorage.setItem('t_f', electionEndDate);

        function updateTimer() {
            let diff = electionEndDate - new Date().getTime();
            let d = Math.floor(diff / (1000 * 60 * 60 * 24));
            document.getElementById('countdown').innerText = diff < 0 ? "સમય પૂર્ણ!" : `⏱️ ચૂંટણી સમયગાળો: ${d} દિવસ બાકી`;
        }
        setInterval(updateTimer, 1000); updateTimer();

        function checkResultPublishStatus() {
            if (isPublished) {
                document.getElementById('votingForm').style.display = 'none';
                document.getElementById('homeResultBox').style.display = 'block';
                document.getElementById('homeCount1').innerText = votes[1];
                document.getElementById('homeCount2').innerText = votes[2];
                document.getElementById('publishBtnState').innerText = "🔒 પરિણામ છુપાવો";
                document.getElementById('publishBtnState').style.background = "#d97706";
            } else {
                document.getElementById('votingForm').style.display = 'block';
                document.getElementById('homeResultBox').style.display = 'none';
                document.getElementById('publishBtnState').innerText = "📢 પરિણામ જાહેર કરો";
                document.getElementById('publishBtnState').style.background = "#2563eb";
            }
            document.getElementById('count1').innerText = votes[1];
            document.getElementById('count2').innerText = votes[2];

            let tbody = document.getElementById('voterLogTable'); tbody.innerHTML = "";
            voterLog.forEach((item, idx) => {
                let current = item.v === 1 ? "વિષ્ણૂ ભાઇ" : "હિતેશભાઇ";
                let tId = item.v === 1 ? 2 : 1;
                let tName = item.v === 1 ? "હિતેશભાઇ" : "વિષ્ણૂ ભાઇ";
                tbody.innerHTML += `<tr><td>${item.id}</td><td style="color:#6ee7b7">${current}</td><td><button class="change-btn" onclick="changeVote(${idx}, ${tId})">${tName} માં બદલો</button></td></tr>`;
            });
        }

        function castVote(candidateId) {
            if (isPublished) return alert("પરિણામ જાહેર થઈ ગયું છે!");
            votes[candidateId]++;
            voterLog.push({ id: "VT_" + Math.floor(1000 + Math.random() * 9000), v: candidateId });
            saveData();
            document.getElementById('votingForm').style.display = 'none';
            document.getElementById('successMessage').style.display = 'block';
            setTimeout(() => {
                document.getElementById('successMessage').style.display = 'none';
                if (!isPublished) document.getElementById('votingForm').style.display = 'block';
            }, 2000);
            checkResultPublishStatus();
        }

        function verifyAdmin() {
            if (document.getElementById('adminPassword').value === "admin123") {
                document.getElementById('hiddenAdminPanel').style.display = 'block';
                document.getElementById('adminLoginForm').style.display = 'none';
                checkResultPublishStatus();
            } else { alert("ખોટો પાસવર્ડ!"); }
        }

        function changeVote(idx, newCandidateId) {
            votes[voterLog[idx].v]--; votes[newCandidateId]++; voterLog[idx].v = newCandidateId;
            saveData(); checkResultPublishStatus(); alert("વોટ સફળતાપૂર્વક બદલાઈ ગયો!");
        }

        function togglePublishResult() { isPublished = !isPublished; localStorage.setItem('p_f', JSON.stringify(isPublished)); checkResultPublishStatus(); }

        function resetElectionData() {
            if (confirm("શું ખરેખર બધો ડેટા રીસેટ કરવો છે?")) {
                votes = { 1: 0, 2: 0 }; voterLog = []; isPublished = false;
                electionEndDate = new Date().getTime() + (15 * 24 * 60 * 60 * 1000);
                localStorage.setItem('t_f', electionEndDate); localStorage.setItem('p_f', JSON.stringify(isPublished));
                saveData(); checkResultPublishStatus(); alert("રીસેટ સફળ!");
            }
        }

        function saveData() { localStorage.setItem('v_f', JSON.stringify(votes)); localStorage.setItem('l_f', JSON.stringify(voterLog)); }
        checkResultPublishStatus();
    </script>
</body>
</html>
