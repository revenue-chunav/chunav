<!DOCTYPE html>
<html lang="gu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>મહેસુલી કર્મચારી મંડળ ચૂંટણી</title>
    <style>
        body { font-family: sans-serif; background-color: #f1f5f9; color: #334155; text-align: center; padding: 20px; }
        .container { max-width: 500px; width: 100%; background: #fff; padding: 25px; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.05); display: inline-block; }
        .card { border: 1px solid #e2e8f0; border-radius: 12px; padding: 15px; margin: 12px 0; display: flex; justify-content: space-between; align-items: center; background: #fff; }
        .vote-btn { background: #1e3a8a; color: #fff; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-weight: bold; }
        .admin-panel { background: #0f172a; color: #fff; padding: 20px; border-radius: 12px; margin-top: 15px; text-align: left; display: none; }
        .hidden { display: none !important; }
    </style>
</head>
<body>
    <div class="container">
        <h1>મહેસુલી કર્મચારી મંડળ ચૂંટણી</h1>
        <div style="background:#fef2f2; color:#991b1b; padding:6px; border-radius:20px; font-weight:bold; margin-bottom:15px; display:inline-block;" id="countdown">૩૦ દિવસ બાકી</div>
        <div id="voterAuthForm" style="background:#f8fafc; border:1px solid #cbd5e1; padding:15px; border-radius:8px; text-align:left;">
            <h4 style="margin-top:0; color:#1e3a8a;">🛡️ વોટર આઈડી ચકાસણી (ચીટિંગ પ્રોટેક્શન)</h4>
            <div style="margin-top:8px; display:flex; gap:10px;">
                <input type="text" id="voterIdInput" placeholder="કર્મચારી ID લખો (દા.ત. EMP101)" style="padding:10px; border-radius:6px; border:1px solid #cbd5e1; flex:1;">
                આઈડી ચેક કરો</button>
            </div>
            <p id="authErrorMsg" style="color:#dc2626; font-size:0.9rem; margin-top:5px; display:none; font-weight:bold;"></p>
        </div>
        <div id="votingForm" class="hidden">
            <p style="color:#166534; font-weight:bold; text-align:left;" id="welcomeVoterMsg"></p>
            <div id="candidatesContainer"></div>
        </div>
        <div id="successMessage" style="display:none; color:#10b981; font-size:1.3rem; font-weight:bold; margin-top:15px;">✓ મત સફળતાપૂર્વક નોંધાઈ ગયો!</div>
        <div id="homeResultBox" style="background:#f0fdf4; border:2px solid #bbf7d0; padding:15px; border-radius:12px; margin-top:15px; text-align:left; display:none;">
            <h3 style="color:#166534; text-align:center; margin-top:0;">📢 ચૂંટણીનું અંતિમ પરિણામ</h3>
            <div id="finalResultsContainer"></div>
        </div>
    </div>
    <div style="margin-top:30px; border-top:1px dashed #cbd5e1; padding-top:15px;">
        <button style="background:none; border:none; color:#64748b; cursor:pointer; text-decoration:underline;" onclick="toggleAdminForm()">🔐 ગુપ્ત એડમીન વિભાગ</button>
        <div id="adminLoginForm" style="display:none; margin-top:10px;">
            <input type="password" id="adminPassword" placeholder="ગુપ્ત પાસવર્ડ" style="padding:8px; border-radius:6px; border:1px solid #cbd5e1;">
            <button class="vote-btn" style="padding:8px 15px;" onclick="verifyAdmin()">પ્રવેશ કરો</button>
        </div>
        <div id="hiddenAdminPanel" class="admin-panel">
            <div style="display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid #334155; padding-bottom:10px;">
                <h3 style="margin:0; color:#f59e0b;">📊 લાઇવ ડેશબોર્ડ</h3>
                <div>
                    <button id="publishBtnState" style="background:#2563eb; color:#fff; border:none; padding:8px; border-radius:6px; cursor:pointer;" onclick="togglePublishResult()">📢 પરિણામ જાહેર કરો</button>
                    <button style="background:#dc2626; color:#fff; border:none; padding:8px; border-radius:6px; cursor:pointer;" onclick="resetElectionData()">🔄 રીસેટ ઓપ્શન</button>
                </div>
            </div>
            <div style="background:#1e293b; padding:12px; border-radius:8px; margin-top:15px;">
                <h4>📋 કર્મચારી લિસ્ટ અપલોડ (.txt ફાઇલ)</h4>
                <input type="file" id="pdfUpload" accept=".txt" onchange="handleFileUpload(event)">
                <p style="font-size:0.8rem; color:#94a3b8;">*ફોર્મેટ: નામ, આઈડી (દા.ત. વિષ્ણૂ ભાઇ દેસાઇ, EMP101)</p>
            </div>
            <h4 style="margin-top:20px;">📊 લાઇવ મત ગણતરી:</h4>
            <div id="adminLiveVotes"></div>
        </div>
    </div>
    <script>
        let candidates = JSON.parse(localStorage.getItem('cand_list')) || [];
        let voterDb = JSON.parse(localStorage.getItem('voter_db')) || {};
        let votes = JSON.parse(localStorage.getItem('votes_db')) || {};
        let usedIds = JSON.parse(localStorage.getItem('used_ids')) || {};
        let isPublished = JSON.parse(localStorage.getItem('is_pub')) || false;
        let currentVerifiedId = "", electionEndDate = localStorage.getItem('end_t') || new Date().getTime() + (30*24*60*60*1000);
        localStorage.setItem('end_t', electionEndDate);

        function updateTimer() {
            let diff = electionEndDate - new Date().getTime();
            let d = Math.floor(diff / (1000 * 60 * 60 * 24));
            document.getElementById('countdown').innerText = diff < 0 ? "સમય પૂર્ણ!" : `⏱️ ચૂંટણી સમયગાળો: ${d} દિવસ બાકી`;
        }
        setInterval(updateTimer, 1000); updateTimer();

        function handleFileUpload(event) {
            const file = event.target.files[0]; if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                const lines = e.target.result.split('\n').map(l => l.trim()).filter(l => l.length > 0);
                candidates = []; voterDb = {}; votes = {}; usedIds = {};
                lines.forEach(line => {
                    const parts = line.split(',');
                    if(parts.length >= 2) {
                        const name = parts[0].trim(), empId = parts[1].trim();
                        if(!candidates.includes(name)) { candidates.push(name); votes[name] = 0; }
                        voterDb[empId] = name;
                    }
                });
                localStorage.setItem('cand_list', JSON.stringify(candidates));
                localStorage.setItem('voter_db', JSON.stringify(voterDb));
                localStorage.setItem('used_ids', JSON.stringify(usedIds));
                saveData(); checkResultPublishStatus(); alert("સફળતાપૂર્વક આઈડી લોડ થયા!");
            }; reader.readAsText(file);
        }

        function verifyVoterIdentity() {
            const inputId = document.getElementById('voterIdInput').value.trim();
            const errorMsg = document.getElementById('authErrorMsg');
            if(!voterDb[inputId]) { errorMsg.innerText = "❌ આઈડી રજીસ્ટર્ડ નથી!"; errorMsg.style.display = "block"; return; }
            if(usedIds[inputId]) { errorMsg.innerText = "⚠️ આ આઈડી પરથી વોટ અપાઈ ગયો છે!"; errorMsg.style.display = "block"; return; }
            errorMsg.style.display = "none"; currentVerifiedId = inputId; checkResultPublishStatus();
        }

        function checkResultPublishStatus() {
            if (isPublished) {
                document.getElementById('voterAuthForm').style.display = 'none';
                document.getElementById('votingForm').style.display = 'none';
                document.getElementById('homeResultBox').style.display = 'block';
                let fc = document.getElementById('finalResultsContainer'); fc.innerHTML = "";
                candidates.forEach(n => { fc.innerHTML += `<p>• ${n}: ${votes[n] || 0} મત</p>`; });
                document.getElementById('publishBtnState').innerText = "🔒 પરિણામ છુપાવો";
            } else {
                if(currentVerifiedId) {
                    document.getElementById('voterAuthForm').style.display = 'none';
                    document.getElementById('votingForm').classList.remove('hidden');
                    document.getElementById('votingForm').style.display = 'block';
                    document.getElementById('welcomeVoterMsg').innerText = "👤 ઓળખ સફળ: " + voterDb[currentVerifiedId];
                    let cc = document.getElementById('candidatesContainer'); cc.innerHTML = "";
                    candidates.forEach(n => { cc.innerHTML += `<div class="card"><span>${n}</span><button class="vote-btn" onclick="castVote('${n}')">Vote Now</button></div>`; });
                } else {
                    document.getElementById('voterAuthForm').style.display = 'block';
                    document.getElementById('votingForm').style.display = 'none';
                }
                document.getElementById('homeResultBox').style.display = 'none';
                document.getElementById('publishBtnState').innerText = "📢 પરિણામ જાહેર કરો";
            }
            let lv = document.getElementById('adminLiveVotes'); lv.innerHTML = "";
            candidates.forEach(n => { lv.innerHTML += `<p>${n}: ${votes[n] || 0} મત</p>`; });
        }

        function castVote(name) {
            votes[name]++; usedIds[currentVerifiedId] = true; saveData(); currentVerifiedId = "";
            document.getElementById('voterIdInput').value = ""; document.getElementById('votingForm').style.display = 'none';
            document.getElementById('successMessage').style.display = 'block';
            setTimeout(() => { document.getElementById('successMessage').style.display = 'none'; checkResultPublishStatus(); }, 2000);
        }

        function toggleAdminForm() { let f = document.getElementById('adminLoginForm'); f.style.display = f.style.display === 'none' ? 'block' : 'none'; }
        
        function verifyAdmin() {
